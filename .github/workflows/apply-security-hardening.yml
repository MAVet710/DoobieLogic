name: Apply security hardening

on:
  push:
    branches:
      - security/harden-auth-bootstrap

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-auth-bootstrap

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply auth and bootstrap hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          api = Path('doobielogic/api_v4.py')
          s = api.read_text()
          s = s.replace(
              'from base64 import b64decode\nfrom typing import Any\n',
              'from base64 import b64decode\nfrom secrets import compare_digest\nfrom typing import Any\n',
          )
          s = s.replace(
              '    if API_KEY and safe_key == API_KEY:\n        return\n\n    if not API_KEY and not safe_key:\n        return\n',
              '    if API_KEY and compare_digest(safe_key, API_KEY):\n        return\n\n    if not API_KEY and not safe_key:\n        if CONFIG.production_like_env:\n            raise HTTPException(\n                status_code=401,\n                detail="Service authentication is required in deployed environments. Configure DOOBIE_API_KEY or issue a service key.",\n            )\n        return\n',
          )
          s = s.replace(
              '    if ADMIN_API_KEY and token == ADMIN_API_KEY:\n        return\n',
              '    if ADMIN_API_KEY and compare_digest(token, ADMIN_API_KEY):\n        return\n',
          )
          old_bootstrap = '''@app.post("/api/v1/admin/bootstrap/generate")\ndef admin_bootstrap_generate(req: AdminBootstrapGenerateReq) -> dict[str, Any]:\n    if ADMIN_API_KEY:\n        raise HTTPException(status_code=409, detail="Bootstrap disabled: ADMIN_API_KEY env is already configured")\n    if KEY_STORE.has_active_admin_key():\n        raise HTTPException(status_code=409, detail="Bootstrap disabled: an admin API key already exists")\n    generated = KEY_STORE.create_admin_api_key(label=req.label, notes=req.notes, is_bootstrap=True)\n    return {"record_id": generated.record_id, "raw_key": generated.raw_key, "key_preview": generated.key_preview}\n'''
          new_bootstrap = '''@app.post("/api/v1/admin/bootstrap/generate")\ndef admin_bootstrap_generate(\n    req: AdminBootstrapGenerateReq,\n    x_bootstrap_token: str | None = Header(default=None),\n) -> dict[str, Any]:\n    if ADMIN_API_KEY:\n        raise HTTPException(status_code=409, detail="Bootstrap disabled: ADMIN_API_KEY env is already configured")\n    if KEY_STORE.has_active_admin_key():\n        raise HTTPException(status_code=409, detail="Bootstrap disabled: an admin API key already exists")\n\n    bootstrap_token = str(os.environ.get("DOOBIE_ADMIN_BOOTSTRAP_TOKEN") or "").strip()\n    supplied_token = str(x_bootstrap_token or "").strip()\n    if CONFIG.production_like_env:\n        if not bootstrap_token:\n            raise HTTPException(\n                status_code=503,\n                detail="Admin bootstrap is disabled until DOOBIE_ADMIN_BOOTSTRAP_TOKEN is configured.",\n            )\n        if not supplied_token or not compare_digest(supplied_token, bootstrap_token):\n            raise HTTPException(status_code=401, detail="Unauthorized")\n    elif bootstrap_token and (not supplied_token or not compare_digest(supplied_token, bootstrap_token)):\n        raise HTTPException(status_code=401, detail="Unauthorized")\n\n    generated = KEY_STORE.create_admin_api_key(label=req.label, notes=req.notes, is_bootstrap=True)\n    return {"record_id": generated.record_id, "raw_key": generated.raw_key, "key_preview": generated.key_preview}\n'''
          if old_bootstrap not in s:
              raise SystemExit('bootstrap target not found; refusing partial patch')
          s = s.replace(old_bootstrap, new_bootstrap)
          api.write_text(s)

          cfg = Path('doobielogic/config.py')
          c = cfg.read_text()
          c = c.replace(
              '    "RENDER_GIT_COMMIT",\n)',
              '    "RENDER_GIT_COMMIT",\n    "K_SERVICE",\n    "K_REVISION",\n    "K_CONFIGURATION",\n    "GOOGLE_CLOUD_PROJECT",\n    "FLY_APP_NAME",\n    "RAILWAY_ENVIRONMENT",\n    "DYNO",\n    "WEBSITE_SITE_NAME",\n)',
          )
          c = c.replace(
              '        for name in ("RENDER", "RENDER_SERVICE_NAME", "RENDER_EXTERNAL_URL", "RENDER_GIT_COMMIT")\n',
              '        for name in (\n            "RENDER",\n            "RENDER_SERVICE_NAME",\n            "RENDER_EXTERNAL_URL",\n            "RENDER_GIT_COMMIT",\n            "K_SERVICE",\n            "K_REVISION",\n            "K_CONFIGURATION",\n            "GOOGLE_CLOUD_PROJECT",\n            "FLY_APP_NAME",\n            "RAILWAY_ENVIRONMENT",\n            "DYNO",\n            "WEBSITE_SITE_NAME",\n        )\n',
          )
          cfg.write_text(c)

          env = Path('.env.example')
          e = env.read_text()
          if 'DOOBIE_ADMIN_BOOTSTRAP_TOKEN=' not in e:
              e += '\n# Required before the first admin API key can be minted on deployed environments.\nDOOBIE_ADMIN_BOOTSTRAP_TOKEN=replace-with-a-long-random-one-time-token\n'
          env.write_text(e)

          tests = Path('tests/test_api_v4_licensing.py')
          t = tests.read_text()
          marker = 'def test_deployed_service_auth_fails_closed_when_no_key_is_configured'
          if marker not in t:
              t += '''\n\ndef test_deployed_service_auth_fails_closed_when_no_key_is_configured(monkeypatch, tmp_path):\n    monkeypatch.setattr("doobielogic.api_v4.API_KEY", "")\n    monkeypatch.setattr("doobielogic.api_v4.CONFIG", type("Cfg", (), {"production_like_env": True})())\n    monkeypatch.setattr("doobielogic.api_v4.KEY_STORE", KeyStore(path=tmp_path / "keys.db"))\n\n    res = client.get("/api/v1/auth/check")\n    assert res.status_code == 401\n    assert "Service authentication is required" in res.json()["detail"]\n\n\ndef test_deployed_admin_bootstrap_requires_secret_token(monkeypatch, tmp_path):\n    monkeypatch.setattr("doobielogic.api_v4.ADMIN_API_KEY", "")\n    monkeypatch.setattr("doobielogic.api_v4.CONFIG", type("Cfg", (), {"production_like_env": True})())\n    monkeypatch.setattr("doobielogic.api_v4.KEY_STORE", KeyStore(path=tmp_path / "keys.db"))\n    monkeypatch.delenv("DOOBIE_ADMIN_BOOTSTRAP_TOKEN", raising=False)\n\n    disabled = client.post("/api/v1/admin/bootstrap/generate", json={"label": "Initial", "notes": ""})\n    assert disabled.status_code == 503\n\n    monkeypatch.setenv("DOOBIE_ADMIN_BOOTSTRAP_TOKEN", "deployment-bootstrap-secret")\n    missing = client.post("/api/v1/admin/bootstrap/generate", json={"label": "Initial", "notes": ""})\n    assert missing.status_code == 401\n\n    good = client.post(\n        "/api/v1/admin/bootstrap/generate",\n        headers={"x-bootstrap-token": "deployment-bootstrap-secret"},\n        json={"label": "Initial", "notes": ""},\n    )\n    assert good.status_code == 200\n    assert good.json()["raw_key"].startswith("DLB-ADM-")\n'''
          tests.write_text(t)

          cfg_tests = Path('tests/test_config_backend_mode.py')
          ct = cfg_tests.read_text()
          cloud_marker = 'def test_cloud_run_environment_is_production_like'
          if cloud_marker not in ct:
              ct += '''\n\ndef test_cloud_run_environment_is_production_like():\n    cfg = load_doobie_config({"K_SERVICE": "doobielogic-api"})\n    assert cfg.production_like_env is True\n'''
          cfg_tests.write_text(ct)
          PY

      - name: Install test dependencies
        run: python -m pip install -e . pytest

      - name: Run regression tests
        run: python -m pytest -q

      - name: Commit hardened code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doobielogic/api_v4.py doobielogic/config.py .env.example tests/test_api_v4_licensing.py tests/test_config_backend_mode.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "security: harden deployed auth and admin bootstrap"
          git push origin HEAD:security/harden-auth-bootstrap
