name: Sanitize public test credential

on:
  push:
    branches:
      - security/sanitize-test-credential

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/sanitize-test-credential
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace remaining user-specific auth fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/test_api_v4_licensing.py')
          text = path.read_text()
          pattern = re.compile(
              r'def test_admin_endpoints_accept_basic_auth_with_configured_admin_user\(monkeypatch, tmp_path\):\n.*?(?=\n\ndef )',
              re.S,
          )
          replacement = '''def test_admin_endpoints_accept_basic_auth_with_configured_admin_user(monkeypatch, tmp_path):
              monkeypatch.setattr("doobielogic.api_v4.ADMIN_API_KEY", "")
              monkeypatch.setattr("doobielogic.api_v4.LICENSE_STORE", LicenseStore(path=tmp_path / "store.json"))
              monkeypatch.setenv("DOOBIE_ADMIN_USERNAME", "test-admin")
              monkeypatch.setenv("DOOBIE_ADMIN_PASSWORD_HASH", "$2b$12$MoP2N.Y9hPY747f4sUnRNejdz.9wtfCFCbKc8W5Oe1xmrcHDx6KTi")

              token = base64.b64encode(b"test-admin:doobielogic-test-admin-2026").decode("utf-8")
              res = client.get("/api/v1/admin/customers", headers={"Authorization": f"Basic {token}"})
              assert res.status_code == 200
              assert res.json() == {"customers": []}
          '''
          replacement = '\n'.join(line[14:] if line.startswith('              ') else line for line in replacement.splitlines())
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one auth fixture block, replaced {count}')
          path.write_text(updated)
          PY
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Run auth regression tests
        run: python -m pytest -q tests/test_admin_auth.py tests/test_api_v4_licensing.py
      - name: Commit sanitized fixture
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api_v4_licensing.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "security: sanitize remaining public auth fixture"
          git push origin HEAD:security/sanitize-test-credential
